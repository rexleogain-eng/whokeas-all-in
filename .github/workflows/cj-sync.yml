name: WHOKEAS CJ Product Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cj-sync.yml"
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

concurrency:
  group: whokeas-cj-product-sync
  cancel-in-progress: false

jobs:
  sync-cj-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sync protected CJ product batch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://www.whokeas.store/api/cron/cj-sync"
